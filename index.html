<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zyro AI Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:#0a0c10;min-height:100vh}
  .zy-launcher{position:fixed;bottom:28px;left:28px;width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;z-index:9999;background:linear-gradient(145deg,#2563ff,#1e4fd6);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(37,99,255,.45);transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
  .zy-launcher:hover{transform:translateY(-3px) scale(1.05)}
  .zy-launcher.open{transform:rotate(90deg)}
  .zy-panel{position:fixed;bottom:100px;left:28px;width:380px;max-width:calc(100vw - 36px);height:600px;max-height:calc(100vh - 140px);z-index:9998;background:#0f131a;border:1px solid rgba(255,255,255,.08);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);opacity:0;transform:translateY(20px) scale(.97);pointer-events:none;transition:all .35s cubic-bezier(.2,.9,.3,1.1)}
  .zy-panel.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
  .zy-header{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg,rgba(37,99,255,.1),transparent)}
  .zy-brand{display:flex;gap:11px;align-items:center}
  .zy-mark{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(140deg,#2563ff,#1e4fd6)}
  .zy-name{color:#f5f7fa;font-weight:700;font-size:14px;letter-spacing:.5px}
  .zy-tag{color:#7e8da3;font-size:10px;letter-spacing:1px;margin-top:2px;text-transform:uppercase}
  .zy-status{color:#5fd38a;font-size:11px;display:flex;align-items:center;gap:6px}
  .zy-dot{width:7px;height:7px;border-radius:50%;background:#5fd38a;box-shadow:0 0 8px #5fd38a;animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .zy-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:13px}
  .zy-body::-webkit-scrollbar{width:5px}
  .zy-body::-webkit-scrollbar-thumb{background:rgba(37,99,255,.4);border-radius:3px}
  .zy-intro{color:#aab6c8;font-size:13px;line-height:1.6;margin-bottom:4px}
  .zy-intro b{color:#f5f7fa;font-size:17px;font-weight:700;display:block;margin-bottom:6px}
  .zy-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .zy-field label{color:#7e8da3;font-size:11px;letter-spacing:.5px;text-transform:uppercase}
  .zy-field input,.zy-field textarea{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 13px;color:#f5f7fa;font-size:13.5px;font-family:inherit;outline:none;resize:none}
  .zy-field input:focus,.zy-field textarea:focus{border-color:#2563ff}
  .zy-field input::placeholder,.zy-field textarea::placeholder{color:#5a6678}
  .zy-submit{width:100%;padding:13px;border:none;border-radius:11px;cursor:pointer;color:#fff;font-family:inherit;font-weight:700;font-size:14px;margin-top:4px;background:linear-gradient(140deg,#2563ff,#1e4fd6);transition:transform .2s}
  .zy-submit:hover:not(:disabled){transform:translateY(-2px)}
  .zy-submit:disabled{opacity:.5;cursor:default}
  .zy-err{color:#ff8b8b;font-size:12px;margin-top:6px}
  .zy-msg{display:flex;gap:9px;max-width:90%;animation:rise .4s ease both}
  .zy-msg.user{align-self:flex-end;flex-direction:row-reverse}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
  .zy-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(140deg,#2563ff,#1e4fd6)}
  .zy-bubble{padding:12px 15px;border-radius:13px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
  .zy-msg.bot .zy-bubble{background:rgba(255,255,255,.05);color:#dde4ee;border:1px solid rgba(255,255,255,.08);border-top-left-radius:4px}
  .zy-msg.user .zy-bubble{background:linear-gradient(140deg,#2563ff,#1e4fd6);color:#fff;font-weight:500;border-top-right-radius:4px}
  .zy-typing{display:flex;gap:5px;padding:13px 15px}
  .zy-typing span{width:7px;height:7px;border-radius:50%;background:#2563ff;animation:bounce 1.2s infinite}
  .zy-typing span:nth-child(2){animation-delay:.15s}.zy-typing span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
  .zy-input{padding:13px;display:flex;gap:9px;border-top:1px solid rgba(255,255,255,.07)}
  .zy-input.hidden{display:none}
  .zy-input input{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:11px 13px;color:#f5f7fa;font-size:13.5px;font-family:inherit;outline:none}
  .zy-input input::placeholder{color:#5a6678}
  .zy-input input:focus{border-color:#2563ff}
  .zy-input button{width:44px;border:none;border-radius:11px;cursor:pointer;color:#fff;background:linear-gradient(140deg,#2563ff,#1e4fd6);display:grid;place-items:center}
</style>
</head>
<body>
<button class="zy-launcher" id="launcher">
  <svg id="ico-open" width="26" height="26" viewBox="0 0 32 32" fill="none">
    <path d="M5 7h22a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H15l-6 5v-5H5a3 3 0 0 1-3-3V10a3 3 0 0 1 3-3z" fill="currentColor"/>
    <path d="M16 11l1.6 4.2L22 17l-4.4 1.8L16 23l-1.6-4.2L10 17l4.4-1.8z" fill="#2563ff"/>
  </svg>
</button>
<div class="zy-panel" id="panel">
  <div class="zy-header"><div class="zy-brand"><div class="zy-mark">Z</div><div><div class="zy-name">Zyro AI</div><div class="zy-tag">AI Automation Agency</div></div></div><div class="zy-status"><span class="zy-dot"></span> Online</div></div>
  <div class="zy-body" id="body">
    <div id="form">
      <div class="zy-intro"><b>Get your free AI growth pitch.</b>Tell us about your business and our AI instantly shows you exactly what Zyro can build, automate, and scale for you — no cost, no commitment.</div>
      <div class="zy-field"><label>Name</label><input id="f-name" placeholder="Your name"></div>
      <div class="zy-field"><label>Email</label><input id="f-email" type="email" placeholder="you@company.com"></div>
      <div class="zy-field"><label>Phone</label><input id="f-phone" placeholder="+91 …"></div>
      <div class="zy-field"><label>Tell us about your business</label><textarea id="f-biz" rows="2" placeholder="What do you do? e.g. I run a dental clinic, a car dealership, a restaurant…"></textarea></div><button class="zy-submit" id="submit">Get my free pitch →</>
      <button class="zy-submit" id="submit">Show me how →</button>
      <div class="zy-err" id="err"></div>
    </div>
  </div>
  <div class="zy-input hidden" id="inputbar"><input id="chat-input" placeholder="Ask a follow-up…"><button id="send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12l16-8-6 8 6 8-16-8z" fill="currentColor"/></svg></button></div>
</div>
<script>
const $ = id => document.getElementById(id);
let panelOpen = false, history = [];
$("launcher").onclick = () => {
  panelOpen = !panelOpen;
  $("panel").classList.toggle("open", panelOpen);
  $("launcher").classList.toggle("open", panelOpen);
  $("ico-open").innerHTML = panelOpen
    ? '<path d="M9 9l14 14M23 9L9 23" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>'
    : '<path d="M5 7h22a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H15l-6 5v-5H5a3 3 0 0 1-3-3V10a3 3 0 0 1 3-3z" fill="currentColor"/><path d="M16 11l1.6 4.2L22 17l-4.4 1.8L16 23l-1.6-4.2L10 17l4.4-1.8z" fill="#2563ff"/>';
};
function addMsg(role, text){
  const d = document.createElement("div");
  d.className = "zy-msg " + role;
  d.innerHTML = (role === "bot" ? '<div class="zy-avatar">Z</div>' : '') + '<div class="zy-bubble"></div>';
  d.querySelector(".zy-bubble").textContent = text;
  $("body").appendChild(d); $("body").scrollTop = $("body").scrollHeight; return d;
}
function addTyping(){
  const d = document.createElement("div");
  d.className = "zy-msg bot";
  d.innerHTML = '<div class="zy-avatar">Z</div><div class="zy-typing"><span></span><span></span><span></span></div>';
  $("body").appendChild(d); $("body").scrollTop = $("body").scrollHeight; return d;
}
$("submit").onclick = async () => {
  const name=$("f-name").value.trim(), email=$("f-email").value.trim(), phone=$("f-phone").value.trim(), business=$("f-biz").value.trim();
  if(!name||!email||!phone||!business){ $("err").textContent="Please fill in all fields."; return; }
  $("err").textContent=""; $("submit").disabled=true;
  $("form").remove(); addMsg("user", business);
  const t = addTyping();
  try{
    const res = await fetch("/lead",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,email,phone,business})});
    const data = await res.json(); t.remove();
    const pitch = data.reply || "Thank you — our team will reach out shortly.";
    addMsg("bot", pitch);
    history.push({role:"user",content:business}); history.push({role:"model",content:pitch});
    $("inputbar").classList.remove("hidden");
  }catch(e){ t.remove(); addMsg("bot","Something went wrong. Please try again."); }
};
async function sendChat(){
  const text=$("chat-input").value.trim(); if(!text) return;
  $("chat-input").value=""; addMsg("user",text); history.push({role:"user",content:text});
  const t=addTyping();
  try{
    const res=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
    const data=await res.json(); t.remove();
    const reply=data.reply||"Could you rephrase that?"; addMsg("bot",reply); history.push({role:"model",content:reply});
  }catch(e){ t.remove(); addMsg("bot","Connection issue — please try again."); }
}
$("send").onclick = sendChat;
$("chat-input").addEventListener("keydown", e => { if(e.key==="Enter") sendChat(); });
</script>
</body>
</html>
